# Paperproof deployment on Render.
# Reference: https://render.com/docs/blueprint-spec
#
# Deploy with: New -> Blueprint -> point Render at this repository.
# Render reads this file and creates the service below.

services:
  - type: web
    name: paperproof
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # `free` is 0.1 CPU / 512 MB and spins down after 15 minutes idle.
    # Upload + OCR of a scanned PDF is CPU-bound and memory-hungry; if that is
    # slow, change this to `starter` (0.5 CPU / 512 MB) without touching anything
    # else.
    plan: free
    region: oregon

    # Deploy on every push to the linked branch.
    autoDeployTrigger: commit

    # Caddy proxies /_health to the backend, so this fails closed when the
    # backend is down.
    healthCheckPath: /_health
    maxShutdownDelaySeconds: 60

    envVars:
      # Prompted for in the Render dashboard on first deploy. Without it the app
      # still runs; asking a question returns a "not configured" message and the
      # citation audit still works.
      - key: OPENROUTER_API_KEY
        sync: false

      # ONLY needed when the frontend is served from somewhere other than this
      # service — see vercel.json for the split setup. Leave it unset for the
      # single-origin Render deployment, which needs no CORS configuration
      # because Caddy serves the frontend and the backend from one origin.
      #
      # - key: REFLEX_CORS_ALLOWED_ORIGINS
      #   value: https://paperproof.vercel.app

# Pull request previews are available but opt-in.
previews:
  generation: manual
